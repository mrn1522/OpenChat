name: Desktop build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
      - "desktop/**"
      - ".github/workflows/desktop-*.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build FastAPI sidecar
        shell: pwsh
        run: |
          python -m pip install -r server/requirements-desktop.txt
          Push-Location server
          pyinstaller openchat_server.spec
          Pop-Location
          Copy-Item server/dist/openchat-server.exe desktop/src-tauri/binaries/openchat-server-x86_64-pc-windows-msvc.exe
      - name: Install client and desktop dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix desktop
      - name: Build NSIS installer
        run: npm run build --prefix desktop
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: openchat-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
