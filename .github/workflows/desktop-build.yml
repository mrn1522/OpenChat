name: Desktop build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
      - "desktop/**"
      - ".github/workflows/desktop-*.yml"

permissions:
  contents: read

jobs:
  build:
    # Skip draft PRs: bot review/fix loops happen in draft, so the build only
    # runs once the PR is marked ready for review.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build FastAPI sidecar
        shell: pwsh
        run: |
          python -m pip install -r server/requirements-desktop.txt
          Push-Location server
          pyinstaller openchat_server.spec
          Pop-Location
          Copy-Item server/dist/openchat-server.exe desktop/src-tauri/binaries/openchat-server-x86_64-pc-windows-msvc.exe
      - name: Install client and desktop dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix desktop
      - name: Build NSIS installer
        run: npm run build --prefix desktop
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: openchat-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2 patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build FastAPI sidecar
        run: |
          python -m pip install -r server/requirements-desktop.txt
          (cd server && pyinstaller openchat_server.spec)
          cp server/dist/openchat-server desktop/src-tauri/binaries/openchat-server-x86_64-unknown-linux-gnu
      - name: Install client and desktop dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix desktop
      - name: Build Linux packages
        run: npm run build --prefix desktop
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: openchat-linux-packages
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
