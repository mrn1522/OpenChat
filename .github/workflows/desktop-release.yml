name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release once up front so the per-OS tauri-action jobs below
  # only upload assets and never race to create it.
  create-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "OpenChat ${{ github.ref_name }}" \
            --notes " " \
          || gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json tagName --jq .tagName > /dev/null

  release:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags are needed to diff against the previous release tag
          # when generating patch notes.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build FastAPI sidecar
        shell: pwsh
        run: |
          python -m pip install -r server/requirements-desktop.txt
          Push-Location server
          pyinstaller openchat_server.spec
          Pop-Location
          Copy-Item server/dist/openchat-server.exe desktop/src-tauri/binaries/openchat-server-x86_64-pc-windows-msvc.exe
      - name: Install client and desktop dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix desktop
      - name: Set release version from tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $v = "$env:RELEASE_TAG".TrimStart("v")
          $configPath = "desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $v
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath
          $cargoPath = "desktop/src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = ".*"$', "version = `"$v`"", 1)
          Set-Content $cargoPath $cargo
          Write-Output "Building OpenChat version $v"
      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: OpenChat ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
      - name: Write patch notes to release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/gen_release_notes.py "$env:RELEASE_TAG" --out patch-notes.md
          gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --notes-file patch-notes.md

  release-linux:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2 patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build FastAPI sidecar
        run: |
          python -m pip install -r server/requirements-desktop.txt
          (cd server && pyinstaller openchat_server.spec)
          cp server/dist/openchat-server desktop/src-tauri/binaries/openchat-server-x86_64-unknown-linux-gnu
      - name: Install client and desktop dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix desktop
      - name: Set release version from tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          v="${RELEASE_TAG#v}"
          jq --arg v "$v" '.version = $v' desktop/src-tauri/tauri.conf.json > /tmp/tauri.conf.json \
            && mv /tmp/tauri.conf.json desktop/src-tauri/tauri.conf.json
          sed -i "0,/^version = \".*\"$/s//version = \"$v\"/" desktop/src-tauri/Cargo.toml
          echo "Building OpenChat version $v"
      - name: Build Linux packages (no release upload)
        if: github.ref_type != 'tag'
        run: npm run build --prefix desktop
      - name: Build and publish Linux packages
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
