[package]
name = "openchat-desktop"
version = "0.1.0"
description = "OpenChat Windows desktop client"
authors = ["OpenChat"]
edition = "2021"

[lib]
name = "openchat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
